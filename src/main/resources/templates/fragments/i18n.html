<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Texts for scripts: t('link.copied') returns the text in the viewer's language. -->
<script th:fragment="texts" th:inline="javascript">
    window.RESONA_TEXT = /*[[${T(kz.genvibe.media_management.config.I18n).scriptTexts(#locale)}]]*/ {};
    window.RESONA_LOCALE = /*[[${#locale.language == 'ru' ? 'ru-RU' : 'en-GB'}]]*/ 'en-GB';

    function t(key) {
        var text = window.RESONA_TEXT[key] || key;
        for (var i = 1; i < arguments.length; i++) {
            text = text.split('{' + (i - 1) + '}').join(arguments[i]);
        }
        return text;
    }
</script>

<!-- EN / RU switch: reloads the current page in the chosen language. -->
<div th:fragment="switch(cssClass)" th:class="${cssClass}">
    <a href="?lang=en" lang="en" th:classappend="${#locale.language != 'ru'} ? 'active'">English</a>
    <a href="?lang=ru" lang="ru" th:classappend="${#locale.language == 'ru'} ? 'active'">Русский</a>
</div>

</body>
</html>
