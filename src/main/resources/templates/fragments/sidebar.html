<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="sidebar(activePage)">
    <nav class="sidebar" id="sidebarMenu">
        <div class="sidebar-header">
            <div class="title-content">
                <h2>Resona AI</h2>
                <p th:text="#{nav.admin_panel}">Admin Panel</p>
            </div>
            <hr>
        </div>

        <div class="sidebar-menu">

            <!-- Dashboard доступен всем -->
            <a th:href="@{/dashboard}" class="menu-item"
               th:classappend="${activePage == 'dashboard'} ? 'active'">
                <span class="icon" th:replace="~{fragments/icons :: icon-dashboard}"></span>
                [[#{nav.dashboard}]]
            </a>

            <!-- Остальные только для ADMIN -->
            <div sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/music}" class="menu-item"
                   th:classappend="${activePage == 'music'} ? 'active'">
                    <span class="icon" th:replace="~{fragments/icons :: icon-music}"></span>
                    [[#{nav.music}]]
                </a>

                <a th:href="@{/stores}" class="menu-item"
                   th:classappend="${activePage == 'stores'} ? 'active'">
                    <span class="icon" th:replace="~{fragments/icons :: icon-store}"></span>
                    [[#{nav.stores}]]
                </a>

                <a th:href="@{/jingles}" class="menu-item"
                   th:classappend="${activePage == 'jingles'} ? 'active'">
                    <span class="icon" th:replace="~{fragments/icons :: icon-jingle}"></span>
                    [[#{nav.jingles}]]
                </a>

                <a th:href="@{/analytics}" class="menu-item"
                   th:classappend="${activePage == 'analytics'} ? 'active'">
                    <span class="icon" th:replace="~{fragments/icons :: icon-analytics}"></span>
                    [[#{nav.analytics}]]
                </a>

                <a th:href="@{/settings}" class="menu-item"
                   th:classappend="${activePage == 'settings'} ? 'active'">
                    <span class="icon" th:replace="~{fragments/icons :: icon-settings}"></span>
                    [[#{nav.settings}]]
                </a>

            </div>
        </div>

        <div class="sidebar-footer">
            <a th:href="@{'mailto:numi@weresona.com'}" class="footer-action">
                <span class="icon" th:replace="~{fragments/icons :: icon-help}"></span>
                [[#{nav.help}]]
            </a>

            <div class="sidebar-legal"><a href="/terms" target="_blank" th:text="#{common.terms}">Terms</a> · <a href="/privacy" target="_blank" th:text="#{common.privacy}">Privacy</a></div>

            <div th:replace="~{fragments/i18n :: switch('lang-switch')}"></div>

            <hr>

            <div class="user-profile">
                <span class="icon" th:replace="~{fragments/icons :: icon-account}"></span>
                <div class="user-info">
                    <span class="user-name" th:text="${organization.companyName}">Company name</span>
                    <span class="user-role" th:text="#{nav.role_admin}">Admin</span>
                </div>
            </div>

        </div>

    </nav>
</div>

</body>
</html>
