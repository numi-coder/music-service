<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/onboarding :: layout(~{::content}, #{onboarding.playtime.title}, 'playtime-window.css', 'step-4.png')}">

<th:block th:fragment="content">
    <div class="playtime-content">
        <div class="title-content">
        <h1 th:text="#{onboarding.playtime.heading}">When should the music feel more noticeable?</h1>
        <p th:text="#{onboarding.playtime.hint}">You can change this anytime - the music adapts with your business.</p>
    </div>
        <form th:action="@{/onboarding/step-5}" method="post">
            <div class="pills-group">
                <label th:each="window, iterStat : ${playtimeWindows}" class="pill-item">
                    <input type="radio" name="playtimeWindow"
                           th:value="${window}"
                           th:checked="${iterStat.first}"
                           required>
                    <span th:text="#{${'enum.PlaytimeWindow.' + window.name()}}">Morning only</span>
                </label>
            </div>
            <hr>
            <button class="btn-primary" type="submit" th:text="#{common.continue}">Continue</button>
        </form>
    </div>
</th:block>
</html>
