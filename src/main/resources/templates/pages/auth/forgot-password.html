<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/onboarding :: layout(~{::content}, #{auth.forgot.title}, 'register.css', 'step-7.png')}">

<th:block th:fragment="content">
    <div class="register-content">
        <h1 th:text="#{auth.forgot.heading}">Forgot your password?</h1>

        <div class="form-message" th:if="${param.sent}" th:text="#{auth.forgot.sent}">
            If an account exists for that email, we’ve sent a link to reset the password.
            Check your inbox (and spam folder). The link works for 1 hour.
        </div>
        <div class="form-message error" th:if="${param.expired}" th:text="#{auth.forgot.expired}">
            That reset link has expired or was already used. Enter your email to get a new one.
        </div>

        <form method="post" th:action="@{/auth/forgot-password}" th:unless="${param.sent}">
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" th:placeholder="#{common.email}" required maxlength="254" autofocus>
            </div>
            <hr>
            <button class="btn" type="submit" th:text="#{auth.forgot.submit}">Send reset link</button>
        </form>

        <a class="form-link" th:href="@{/auth/login}" th:text="#{auth.forgot.back}">Back to sign in</a>
    </div>
</th:block>
</html>
