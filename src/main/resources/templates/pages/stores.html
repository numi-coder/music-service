<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
                    ~{::content},
                    #{title.stores},
                    'stores.css',
                    #{nav.stores},
                    'stores'
                    )}">

<th:block th:fragment="content">

    <p class="subtitle" th:text="#{stores.subtitle}">Manage all stores under your company</p>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(stores)}" class="empty-state-container">
        <div class="empty-card">
            <div class="card-icon">
                <span th:replace="~{fragments/icons :: icon-store}"></span>
            </div>

            <div class="empty-icon">
                <h3 th:text="#{stores.empty.title}">No stores added yet</h3>
                <p th:text="#{stores.empty.text}">Add your first store to start playing music</p>
            </div>

            <button class="btn-add-large" onclick="openModal()">
                <span th:replace="~{fragments/icons :: icon-plus}"></span>
                <span class="btn-title" th:text="#{stores.add_new}">Add new store</span>
            </button>
        </div>
    </div>

    <!-- STORES GRID -->
    <div th:if="${!#lists.isEmpty(stores)}">
        <div class="stores-grid">

        <div th:each="store : ${stores}" class="store-card" th:attr="data-id=${store.id}">

            <div class="store-info">

                <div class="store-title-row">
                    <div class="store-status">
                        <h3 th:text="${store.name}">Store name</h3>

                        <span class="status-badge"
                              th:classappend="${store.active ? 'active' : 'inactive'}"
                              th:text="${store.active} ? #{js.store.status.active} : #{store.status.inactive}">
                        </span>
                    </div>

                    <!-- ACTION BUTTON -->
                    <button th:if="${store.active}"
                            class="btn-link-store"
                            th:attr="onclick=|openLink(${store.id}, '${store.name}', '${store.musicLink}')|">
                        [[#{js.store.view}]]
                    </button>

                    <button th:unless="${store.active}"
                            class="btn-link-store"
                            th:attr="onclick=|activateStore(${store.id}, '${store.name}')|">
                        [[#{store.activate}]]
                    </button>
                </div>

                <div class="store-details">
                    <div class="location-title">
                        <div class="icon-store">
                        <span th:replace="~{fragments/icons :: icon-store}"></span></div>
                        <span th:text="${store.location}">Location</span>
                    </div>

                    <div class="location-title">
                        <span th:replace="~{fragments/icons :: icon-email}"></span>
                        <span th:text="${store.email}">Email</span>
                    </div>
                </div>

                <div class="access-title">
                    <p th:if="${store.active}"
                       th:text="#{js.store.last_accessed(${store.lastAccessDate != null ? #temporals.format(store.lastAccessDate, 'd MMM yyyy', #locale) : '—'})}">
                    </p>
                    <p th:unless="${store.active}">
                        [[#{store.activate_hint}]]
                    </p>
                </div>

            </div>
        </div>
        </div>
        <!-- ADD CARD BUTTON -->
        <button class="btn-add-card" onclick="openModal()">
            <span th:replace="~{fragments/icons :: icon-plus}"></span>
            <span class="btn-title" th:text="#{stores.add_new}">Add new store</span>
        </button>

    </div>

    <!-- MODAL (один на всё) -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>

    <div id="modal" class="modal add-store-modal">
        <div class="modal-body">
            <div class="modal-header">
                <h2 th:text="#{dashboard.stores.action}">Add store</h2>
                <span class="close" onclick="closeModal()">
                    <span class="icon" th:replace="~{fragments/icons :: icon-close}"></span>
                </span>
            </div>

            <form th:action="@{/api/stores}" method="post">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Store name" th:placeholder="#{stores.form.name}" required>
                </div>

                <div class="form-group">
                    <label th:text="#{stores.form.location}">Location (optional)</label>
                    <input type="text" name="location" placeholder="123 Main St., City" th:placeholder="#{stores.form.location_placeholder}">
                </div>

                <div class="form-group">
                    <label th:text="#{stores.form.email}">Store Play link will be sent to their email</label>
                    <input type="email" name="email" placeholder="store@email.com" required>
                </div>

                <button type="submit" class="btn-save-store" id="saveStoreBtn" disabled>
                    [[#{stores.form.save}]]
                </button>
            </form>
        </div>
    </div>

    <!-- LINK MODAL -->
    <div id="linkModalOverlay" class="modal-overlay" onclick="closeLinkModal()"></div>

    <div id="linkModal" class="modal link-modal">
        <div class="modal-body">

            <div class="modal-header">
                <h2 th:text="#{store.link.title}">Store music link</h2>
                <span class="close" onclick="closeLinkModal()">
                    <span class="icon" th:replace="~{fragments/icons :: icon-close}"></span>
                </span>
            </div>

            <div class="modal-content">
                <p class="status-active" th:text="#{store.link.active}">Store is active now</p>
                <p class="store-name" id="storeName"></p>
            </div>

                <div class="link-row">
                    <p class="label" th:text="#{store.link.label}">Music access link</p>
                    <div class="link-card">
                        <div id="storeLink" class="link-box"></div>
                        <button onclick="copyLink()" class="btn-copy">
                            <span th:replace="~{fragments/icons :: icon-copy}"></span>
                        </button>
                    </div>
                </div>

            <div class="modal-actions">
                <button onclick="regenerateLink()" class="btn-secondary">
                    <span th:replace="~{fragments/icons :: icon-regenerate}"></span>
                    <span class="btn-title" th:text="#{store.link.regenerate}">Regenerate link</span>
                </button>
                <button onclick="copyLink()" class="btn-primary">
                    <span th:replace="~{fragments/icons :: icon-link}"></span>
                    <span class="btn-title" th:text="#{store.link.copy}">Copy link</span>
                </button>
            </div>

        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">
        <span class="icon" th:insert="~{fragments/icons :: icon-toast}"></span>
        <span id="toastText" th:text="#{js.link.copied}">Link copied</span>
    </div>
    <script>
        const form = document.querySelector('#modal form');
        const btn = document.getElementById('saveStoreBtn');

        const nameInput = form.querySelector('input[name="name"]');
        const emailInput = form.querySelector('input[name="email"]');

        function validateForm() {
            const nameValid = nameInput.value.trim().length > 0;
            const emailValid = emailInput.value.trim().length > 0;

            if (nameValid && emailValid) {
                btn.disabled = false;
                btn.classList.add('enabled');
            } else {
                btn.disabled = true;
                btn.classList.remove('enabled');
            }
        }

        nameInput.addEventListener('input', validateForm);
        emailInput.addEventListener('input', validateForm);
    </script>
    <script>
        let currentStoreId = null;
        let currentLink = "";

        function openLink(id, name, link) {
            currentStoreId = id;

            document.getElementById("storeName").innerText = name;
            document.getElementById("storeLink").innerText = link || t('loading');

            currentLink = link || "";

            document.getElementById("linkModal").style.display = "block";
            document.getElementById("linkModalOverlay").style.display = "block";
        }

        function closeLinkModal() {
            document.getElementById("linkModal").style.display = "none";
            document.getElementById("linkModalOverlay").style.display = "none";
        }

        async function activateStore(id, name) {
            currentStoreId = id;
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;

            document.getElementById("storeLink").innerText = t('loading');
            openLink(id, name, t('loading'));

            try {
                // 1. Activate (response body is the music access link)
                const actRes = await fetch(`/api/stores/activate/${id}`, {
                    method: "POST",
                    headers: { [header]: token }
                });
                if (!actRes.ok) throw new Error("Activation failed");

                const link = await actRes.text();

                // 2. Update UI
                currentLink = link;
                document.getElementById("storeLink").innerText = link;
                markStoreAsActive(id);
                updateStoreLink(id, name, link);
                showToast(t('store.activated'));
            } catch (error) {
                console.error(error);
                showToast(t('store.activation_error'));
            }
        }
        function markStoreAsActive(id) {
            const card = document.querySelector(`.store-card[data-id="${id}"]`);

            if (!card) return;

            const badge = card.querySelector(".status-badge");

            badge.innerText = t('store.status.active');
            badge.classList.remove("inactive");
            badge.classList.add("active");
        }
        function updateStoreLink(id, name, link) {
            const card = document.querySelector(`.store-card[data-id="${id}"]`);
            if (!card) return; // Silent fail if card not found

            const container = card.querySelector(".store-title-row");
            const oldBtn = container?.querySelector(".btn-link-store");

            if (oldBtn) {
                const newBtn = document.createElement("button");
                newBtn.className = "btn-link-store";
                newBtn.innerText = t('store.view');
                newBtn.onclick = () => openLink(id, name, link);
                container.replaceChild(newBtn, oldBtn);
            }
        }
        function showToast(message) {
            const toast = document.getElementById("toast");
            const text = document.getElementById("toastText");
            text.innerText = message;

            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function regenerateLink() {
            if (!currentStoreId) return;

            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;

            fetch(`/api/stores/regenerate-link/${currentStoreId}`, {
                method: "POST",
                headers: {
                    [header]: token
                }
            })
                .then(res => res.text())
                .then(link => {
                    console.log("link:", link);

                    currentLink = link;

                    document.getElementById("storeLink").innerText = link;

                    updateStoreLink(
                        currentStoreId,
                        document.getElementById("storeName").innerText,
                        link
                    );

                    showToast(t('link.regenerated'));
                })
                .catch(err => {
                    console.error(err);
                    showToast(t('link.regenerate_failed'));
                });
        }
        function copyLink() {
            if (!currentLink) {
                showToast(t('link.not_ready'));
                return;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentLink)
                    .then(() => showToast(t('link.copied')))
                    .catch(() => fallbackCopy());
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const textarea = document.createElement("textarea");
            textarea.value = currentLink;

            // чтобы не прыгал экран
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                document.execCommand("copy");
                showToast(t('link.copied'));
            } catch (err) {
                showToast(t('link.copy_failed'));
            }

            document.body.removeChild(textarea);
        }
    </script>
</th:block>
</html>
