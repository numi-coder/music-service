landing.faq.title=Частые вопросы
landing.faq.1.q=Как сохранить единый стиль бренда во всех точках, не контролируя каждую вручную?
landing.faq.1.a=Вы задаёте стандарт один раз — мы соблюдаем его везде. Определите звуковой образ бренда на верхнем уровне, и платформа автоматически применит его во всех точках. Региональные менеджеры и франчайзи могут что-то менять только в рамках, которые задаёте вы. Полная прозрачность. Никакого ручного контроля. Бренд остаётся цельным, будь у вас 10 точек или 1 000.
landing.faq.2.q=Кто отвечает за лицензии на музыку и соблюдение правил — мы или вы?
landing.faq.2.a=Мы. Полностью. Каждый трек подобран ИИ, оригинален и создан специально для коммерческих пространств. Никаких серых зон с лицензиями, споров о роялти и проблем с проверками. В каждой композиции больше 7 инструментов — это богатый, многослойный звук, который украшает пространство, а не просто заполняет его. Настоящая глубина. Настоящее качество. Всё разрешено для каждой вашей точки — вашим юристам ничего делать не нужно.
landing.faq.3.q=Можно ли ставить разную музыку на разное время дня — утро, часы пик, закрытие?
landing.faq.3.a=Не только можно, но и нужно. Атмосфера влияет на поведение, а поведение меняется в течение дня. Составьте расписание, которое меняет энергию от утреннего открытия к обеденному наплыву и спокойному вечеру. Настройте один раз, автоматизируйте везде, меняйте когда угодно. Ваша музыка работает так же усердно, как и ваша команда.
landing.faq.4.q=Какая поддержка нам доступна? Будет ли у нас персональный менеджер?
landing.faq.4.a=Корпоративные клиенты получают корпоративную поддержку: персонального менеджера, который знает ваш бренд, ваши точки и ваш рабочий календарь. Не очередь заявок. Не чат-бот. Живой человек, который отвечает за ваш запуск, пилоты и масштабирование. Мы растём вместе с вами, поэтому ваш успех — это и наш успех.
landing.faq.5.q=Для каких отраслей подходит сервис? Можно ли сначала провести пилот?
landing.faq.5.a=Мы работаем с сетями в рознице, общепите, гостеприимстве, фитнесе, медицине и корпоративных пространствах — везде, где важен единый опыт бренда. И да, мы всегда советуем начать с пилота. Выберите несколько точек, запустите, оцените результаты и подготовьте обоснование внутри компании. Мы сопровождаем пилот от начала до конца и помогаем представить результаты руководству.
