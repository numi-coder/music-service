# Builds and tests every push, and keeps the deployable jar as a download.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build jar
        run: ./gradlew --no-daemon bootJar -x test

      # build.gradle once stripped spring-core etc. out of the jar; fail loudly if that ever happens again.
      - name: Check jar contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain)
          for lib in spring-core spring-boot-4 spring-context postgresql hibernate-core; do
            jar tf "$JAR" | grep -q "BOOT-INF/lib/$lib" || { echo "Missing $lib in $JAR"; exit 1; }
          done
          sha256sum "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: resona-jar-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
